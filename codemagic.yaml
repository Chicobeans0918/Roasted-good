workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build unsigned iOS release
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry coffee-beans-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/coffee-beans-unsigned.ipa

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - apple_keys
      vars:
        BUNDLE_ID: "com.beanquest.coffeeBeans"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # Both keys are stored BASE64-encoded (single line): pasting multi-line PEM
          # into the Codemagic UI strips newlines and corrupts them. Decode them back
          # into the env vars (with real newlines) before the CLI reads them.
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode)"
          export CERTIFICATE_PRIVATE_KEY="$(echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode)"
          # Wipe stale local profiles: a profile built for the revoked cert would
          # otherwise be picked up again and fail signing with "no valid certificates"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
          rm -f ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Set up signing certificate
        script: |
          P12=$(ls ~/Library/Developer/Xcode/UserData/Certificates/*.p12 2>/dev/null | head -1)
          if [ -z "$P12" ]; then
            echo "ERROR: no p12 found"
            exit 1
          fi
          echo "Found p12: $P12"
          # The CLI-built p12 can fail macOS import ("Unable to decode the provided
          # data"). Rebuild it with openssl, which tolerates more formats.
          if openssl pkcs12 -in "$P12" -noout -passin pass: 2>/dev/null; then
            echo "p12 readable, rebuilding clean copy with openssl"
            openssl pkcs12 -in "$P12" -out /tmp/fixed.pem -nodes -passin pass:
            openssl pkcs12 -export -in /tmp/fixed.pem -out /tmp/fixed.p12 -passout pass:
            keychain add-certificates --certificate /tmp/fixed.p12
          else
            echo "openssl cannot read p12 either, trying direct import"
            keychain add-certificates --certificate "$P12"
          fi
      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles
      - name: Diagnose signing state
        script: |
          echo "=== Code signing identities in keychain ==="
          security find-identity -v -p codesigning || true
          echo "=== Downloaded provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none in MobileDevice)"
          ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "(none in Xcode UserData)"
      - name: Build signed IPA
        script: flutter build ipa --release
      - name: Publish to App Store Connect
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode)"
          app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight
    artifacts:
      - build/ios/ipa/*.ipa
