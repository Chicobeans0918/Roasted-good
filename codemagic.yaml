workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build unsigned iOS release
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry coffee-beans-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/coffee-beans-unsigned.ipa

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - apple_keys
      vars:
        BUNDLE_ID: "com.beanquest.coffeeBeans"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # APP_STORE_CONNECT_PRIVATE_KEY holds the .p8 BASE64-encoded (single line):
          # pasting multi-line PEM into the Codemagic UI strips newlines and corrupts it.
          # Decode it back into the env var (with real newlines) before the CLI reads it.
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release
      - name: Publish to App Store Connect
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode)"
          app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight
    artifacts:
      - build/ios/ipa/*.ipa
