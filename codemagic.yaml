workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build unsigned iOS release
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry coffee-beans-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/coffee-beans-unsigned.ipa

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - apple_keys
      vars:
        BUNDLE_ID: "com.beanquest.coffeeBeans"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Decode App Store Connect API key
        script: |
          # APP_STORE_CONNECT_PRIVATE_KEY holds the .p8 BASE64-encoded (single line).
          # Pasting multi-line PEM into the Codemagic UI strips newlines and corrupts it
          # ("not a valid PEM encoded private key"), so we decode it to a file here.
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/asc_key.p8
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --private-key @file:/tmp/asc_key.p8 \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --private-key @file:/tmp/asc_key.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
